{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "skillhub.web.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "skillhub.web.fullname" . }}
    {{- include "skillhub.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "skillhub.web.fullname" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "skillhub.web.fullname" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "skillhub.image" (list . .Values.web) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: SKILLHUB_API_UPSTREAM
              value: {{ printf "http://%s:%d" (include "skillhub.server.fullname" .) (int .Values.server.service.port) | quote }}
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          {{- with .Values.web.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
